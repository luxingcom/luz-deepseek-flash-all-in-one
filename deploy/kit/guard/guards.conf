# ==============================================================================
# 启动前置检查（PRECOND）—— 2026-09-11 扩展（用户第 7 条：自恢复/启动检查纳入统一管理）
#
# 为什么放这里：这些条件**每次开窗、每次启动前**都要人肉确认一遍，而漏掉任何
# 一条的代价都是**整机 OOM**（窗口 2 实测：四机全部宿主机 OOM，worker 被
# shmem-rss 25.10 GiB 杀掉）。把它们变成注册项，就不必再靠记忆。
#
# 格式：PRECOND|<role>|<名称>|<kind>|<参数>|<阈值/期望>|<必需>|<说明>
#   kind=file     参数=<路径>           期望=-                存在即 PASS
#   kind=md5      参数=<路径>           期望=<md5前12位>      用于钉住脚本版本
#   kind=memfree  参数=-                期望=<MiB>            "有效空闲"下限（2026-09-11e 起，见下）
#   kind=memavail 参数=-                期望=<MiB>            MemAvailable 下限（旧口径，保留备用）
#   kind=diskfree 参数=<挂载点>         期望=<MiB>            可用空间下限
#
# ⚠️ 全部是**只读**检查，不需要 root，不改动任何东西。
# ==============================================================================

# 权重红线：未经完整 sha256 校验的权重目录不得挂载给任何容器。
PRECOND|all|weights-sha256|file|<models-dir>/DeepSeek-V4.1-Flash-1017/SHA256SUMS|-|yes|权重校验台账存在（红线载体）。缺失=该目录禁止挂载（MODEL-SWITCH-1017；旧面 SHA256SUMS 保留供回退）
# 开窗前置：停掉生产后必须确认整块池子真的空出来，否则首启必 OOM（窗口 2 教训）。
# 判据 2026-09-11e 第三次修订（前两版都量错了对象）。本项要回答的是"驱动做 gmu 一次性
# 预留（~84 GiB）时内核能给出多少页"，两个候选量实测都不合格（node01）：
#   MemFree 102.9 GiB / MemAvailable 102.6 GiB，而真实可取用 113.3 GiB。
#   · MemAvailable 被 totalreserve_pages 扣掉——prep 抬高水位后 node0 low=3.91 GiB /
#     high=6.33 GiB，即**我们自己的保护动作**压低了被检查的量；
#   · MemFree 不扣水位，但不含干净页缓存，而宿主读过的镜像层/权重分片会留下十几 GiB
#     干净缓存（node01 实测 10.4 GiB），这些页内核随时可回收给驱动。
# 故改量为"有效空闲"= MemFree + Cached + SReclaimable − Shmem，阈值 110 GiB 不变。
PRECOND|all|pool-free|memfree|-|110000|yes|启动前"有效空闲"(MemFree+可回收文件页) ≥ 110 GiB。低于此值说明残留容器/图池未释放，**不要启动**（MemFree/MemAvailable/缓存 三项一并打印以便复核）
# V 轨（2026-09-13）：vLLM 池定尺寸用**裸 MemFree**（干净页缓存被当已用）。同 GMU=0.82 下
# 池漂移 1.56-4.28 GiB 的根因就是起栈时刻页缓存存量；"有效空闲"口径恰好掩盖它。
# 停栈后 drop_caches 应见裸 MemFree ≈100+GiB（2026-09-11d node01 实测 102.9），
# 96 GiB 门留 ~7 GiB 给 Slab/监控容器。低于此值=卫生没做，池会缩水（并发损失可达 2.7×）。
# ⚠️ 2026-09-23 核实：本行点名的两个脚本**不在 <guards-kit-dir>/**（按名裸跑会 not-found；本行没给路径）。
#    同名副本现存三份：~/v41-runtime/v41_kv_hygiene.sh、~/v41-runtime/v41_window_prep.sh、
#    ~/v41-luz-graft/runtime/v41_window_prep.sh（2026-09-23 实测均存在）⇒ 若要按本行启用，
#    须先**明确调用路径**（或把脚本落地进 <guards-kit-dir>），否则这半句是死指针。
#    （原任务书写「该两脚本不存在、需先落地脚本」——按实测更正为「不在本目录/未给路径」，脚本本体存在于上述路径。）
PRECOND|all|memfree-raw-vllm|memfreeraw|-|98304|yes|起栈前裸 MemFree ≥ 96 GiB（vLLM KV 池定尺寸口径；先跑 v41_kv_hygiene.sh / v41_window_prep.sh）。★判据对 SGLang 同样成立（同一台机器的统一内存池；SGLang 起栈前的 drop_caches ×4 就是这条前置在人工侧的等价动作）——行名里的 vllm 是历史遗留
# 磁盘前置：2026-09-11 实测修正。原阈值 100 GiB 是**未测量**的保守估计，实属过严——
# 它把 03/04 永久钉死在 BLOCKED，而这两台正是要跑 V4.1 的机器。
# 实测一次启动真正会写的只有 JIT 缓存与日志，合计 **< 1 MiB**：
#   flashinfer-cache-v41 60K / tilelang-cache-v41 4.0K / vllm-cache-v41 516K / vllm-logs 112K
# 历史上最大的同类缓存 64M（vllm-cache-eugr）。权重与 Engram 全部是**只读**映射，不写盘。
# 故按实测取 20 GiB（≈实测值的 2×10^4 倍，也 > 03 上全部缓存总和的 300 倍）。
# 注意：03/04 上 78 GB "reclaimable" 镜像是与在役镜像**共享层**的，删标签不释放空间；
# 而 157G 的 deepseek-ai/DeepSeek-V4-Flash-Vision-Exp 是在役生产模型，不可删。
PRECOND|all|disk-free-data|diskfree|/data|20480|yes|/data 可用 ≥ 20 GiB（实测启动只写 JIT 缓存/日志 <1 MiB，权重只读）
# 引擎漂移：镜像 digest 被静默替换是"昨天还好今天崩"的经典来源。
PRECOND|all|engine-pin|file|<user-home>/<guards-kit-dir>/guard/BASELINE.md|-|no|引擎基线台账存在（记录期望 RepoDigest / 脚本 md5）

# ---- SGLang 时代（2026-09-16 新增）------------------------------------------
# 止损守护在役：2026-09-15 W4 事故的**根因**就是四机没有 oom_gate monitor 在跑
# （pin 8M 的 prefill 瞬态无人拦，主机直接全局 OOM、scheduler_0 被 -9）。
# GPU 时钟钳制：四机全部 enabled+active，但此前不在任何台账里（亡失无人知）。
# ⚠ 它是 oneshot + RemainAfterExit=yes ⇒ 跑完**一直** active。guardctl 的 oneshot 分支
#   为此专门加了 RemainAfterExit 识别，否则会按 ActiveEnter 的年龄报"已执行 N s 未退出"的假 DEAD。
GUARD|all|gb10-clock-cap.service|oneshot|-|-|-|no|GPU 时钟上限钳制（nvidia-smi -lgc 0,2400）。RemainAfterExit=yes：成功即常驻 active；失效应表现为 Result≠success 或单元消失
# 2026-09-20 R6 断言增强：dsv41-serve 单元 + 锁频实际值（此前守卫只判单元状态，不判值）
# dsv41-serve 是用户级单元，但 guardctl 全部走 system 域 ⇒ 不能用 GUARD 行；改用
# PRECOND|proc 判定自愈挂载形态真身（head=launcher-waiter / worker=docker wait）。
# ★修正 2026-09-20：MainPID argv 实为 `docker wait dsv41-head`（单元名不出现在进程表）。
# head 行匹配 launcher-waiter 形态，worker 行匹配 waiter 形态；两行都必需=no（非阻断）。
PRECOND|head|dsv41-serve-waiter|proc|docker[ ]wait[ ]dsv41-head|1|no|自愈链挂载态：dsv41-serve 单元的 MainPID 必须是 `docker wait dsv41-head`。失效=容器退出后无人重启（09-19 曾 38 连败）。
PRECOND|worker|dsv41-serve-waiter|proc|docker[ ]wait[ ]dsv41-worker|1|no|worker 侧自愈挂载：MainPID=`docker wait dsv41-worker`。
PRECOND|all|clock-sm-actual|archscr|<user-home>/<guards-kit-dir>/guard/clock-sm-guard.sh|-|no|锁频**实际值**体检：clocks.sm 必须落在 [2250,2400] MHz 带（单位检查只看 gb10-clock-cap 的状态，看不出 -lgc 值漂移；2026-09-19 P1-2「2418 假失效」正是这种盲区）。引擎停泊时 clocks.sm 走低 ⇒ SKIP 语义由脚本退出码 2 承担
# 每日冒烟（head 独有；02-04 是 not-found）。用 TIMER 而不是 GUARD：它的新鲜度窗口是"天"，
# 而 oneshot 的 GUARD 新鲜度窗口默认 900s，会把健康的日任务判成 DEGRADED。
# ⚠ TIMER 行只有 6 列：`TIMER|<role>|<timer>|<service>|<enabled>|<desc>` —— **没有 required 列**。
#   判定口径 = "非阻塞但计入"：失效渲染成 WARN 并计入问题数（退出码非 0），不阻断开窗。
#   （旧版对空字段做 `[ "$req" = yes ]` ⇒ 定时器坏了也只打印 FAIL 却仍报 ALL-OK。）
TIMER|head|daily-smoke.timer|daily-smoke.service|no|每日冒烟测试的触发链（NextElapse==infinity 才算失效）
# 这个失效是无声的——进程没了不会报错。口径必须与在役实例一致（见 README/oom-gate）。
# 判据=进程在不在，不含参数；参数漂移用下面 oom-gate-floor 的 envpin 钉。
PRECOND|all|oom-gate-monitor|proc|oom_gate[.]sh monitor|1|yes|开窗前必须确认止损守护在役（`pgrep -af 'oom_gate[.]sh monitor'`）。缺失=本次开窗无兜底，先拉起再动手
# 守护参数（地板/警戒线/连续次数/间隔/动作）也要钉：把 -f 调小等于把兜底放空，而这种改动肉眼看不出来。
# 用 proc 而不是 envpin：参数在**运行进程的 argv** 里，不在脚本文件里（脚本里的只是默认值）。
PRECOND|all|oom-gate-floor|proc|oom_gate[.]sh monitor -w 6 -f 1.5 -n 3 --iv 2 -a -e 1|1|no|守护必须以此 argv 在役：**-w 6（警戒线，只记日志） + -f 1.5（止损线，动作=docker stop，3 次连续破线；★2026-09-23 由 3 下调——用户收尾令第 4 条"峰值内存已获可靠控制"，见 `adr/ADR-004-three-gib-floor-guard.md` §0.1） + -e 1（应急线，单采样零等待立即止损——2026-09-18 用户令：剩余内存 ≤1G 及时 kill 推理）**。★2026-09-18 起由 systemd 单元 oom-gate-monitor.service 托管（Restart=always，根治裸进程不随整机重启自启——当日 01 OOM 未被预拦的根因）。★2026-09-16 变更 #16 定档：**步骤 4 把余量买回来了** —— 4 路×245.7K 的 head eff_MIN **4.38→8.79**、16 路×245.7K（=生产 NSEQ）**3.18→6.58**、avail_MIN 2.20→5.60，总余量 **0.18→3.58 GiB**。⚠ **为什么 `-w` 取 6 而止损线不取 6**（注：止损线自 2026-09-23 起为 1.5，见本行末句）：实测最坏合法负载 16 路×245.7K 的 eff_MIN=6.58，把止损线放到 6 就落在**运营包络之内**，一个略重的合法负载就会**不可逆地 docker stop 生产**。故 6 以 **-w（只记日志）** 形态兑现（用户"守护地板买回 6"的原意在可安全兑现的形态下达成）。★**2026-09-23 修订：`-f` 由 3 → 1.5**（用户令；理由与两条余量事实——`-f` 与 `-e` 之间只剩 0.5 GiB、30 s 确认窗只在 1.0–1.5 GiB 窄带生效——记在 ADR-004 §0.1）。改任一条线都必须同时改本行；与在役实例不符=参数漂移
# 2026-09-18：oom-gate-monitor.service 单元化（四机 enabled+active）。单元失效应在例行 check 就现形。
GUARD|all|oom-gate-monitor.service|simple|always|-|-|yes|OOM 止损守护的 systemd 单元（-w6/-f1.5/-e1 三层）。失效=无人盯内存地板，须 systemctl restart oom-gate-monitor.service
# nvidia 内核模块 flavor 守卫（2026-09-23 补登记：此前**完全不在册** ⇒ 失效无声）。
# 在役证据（本机 <prod-host-01> 实测，2026-09-23）：`systemctl is-enabled`=enabled、`is-active`=active、
# `Type=oneshot`、`RemainAfterExit=yes`、`Result=success`；脚本 md5 `989c04d86368…`（12 位）。
# ⚠️ 「四机一致」是任务书给定值，**本地未 ssh 复核**（禁令：不 ssh）——如需四机断言请另跑核对。
# 为什么必需：它防的是「apt 把 nvidia 模块 flavor 换回 open」，而 open 模块在 GB10 上**已知致命静默楔死**
# （无 OOM kill、无 panic、pstore 空，需断电）——上游根因 issue #1358，unit 的 Documentation= 就指向它。
# ⚠️ 已知缺口（2026-09-23 登记但**未修**）：脚本判据是「只要不是 Open Kernel Module 就报 OK」
#    ⇒ **缺少 `580.` 版本断言**，595/610 等专有模块被误载时同样打印绿字（判据只认 flavor、不认版本）。
GUARD|all|nvmodule-guard.service|oneshot|-|/usr/local/sbin/nvmodule-guard.sh|989c04d86368|yes|nvidia 内核模块 flavor 守卫：开机自检 /proc/driver/nvidia/version，见 open 模块则告警 + 停用 nvidia-*-open 目录 + depmod。防的是「apt 把 flavor 换回 open」（open 模块=GB10 已知致命静默楔死，上游 issue #1358，unit 的 Documentation= 即指向它）。Type=oneshot + RemainAfterExit=yes ⇒ 成功即常驻 active；失效应表现为 Result≠success 或单元消失。⚠️ 已知缺口（2026-09-23 登记未修）：判据「只要不是 Open Kernel Module 就报 OK」，**缺 `580.` 版本断言** ⇒ 595/610 等专有模块误载时同样打印绿字
