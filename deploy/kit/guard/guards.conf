# ==============================================================================
# guards.conf — 守卫清单（声明式）。guardctl.sh 读它来"逐个检查守卫"。
#
# 格式（竖线分隔，勿改字段顺序）：
#   GUARD|<role>|<单元名>|<Type>|<Restart>|<ExecStart 路径>|<期望 md5 前12位>|<必需>|<说明>
#
# role     : head | worker | all   （head/worker 由主机名 <prod-host-01..04> 自动判定；all=每台机器）
# Type     : systemd 单元类型。oneshot 是**危险类型**——见 README §4
#            ⚠ 本列**只给人读**：判定用的是 `systemctl show -p Type` 的真值，注册表写错不会误判
#            （好处=鲁棒；代价=这一列不被任何判定校验，别指望改它能改变行为）。
# Restart  : systemd Restart= 期望值
# md5      : 只比前 12 位（够唯一定位，且避免整串抄错）。留 "-" 表示不校验。
# 必需     : yes = 渲染成 FAIL（阻断开窗/启动）；no = 渲染成 WARN。
#            ★两者**都计入问题数**（退出码非 0）——"它坏了不挡启动"不等于"可以一边打印
#            FAIL 一边宣布 ALL-OK"（2026-09-17 交叉审核 B1：那是旧版的可达态）。
#
# ⚠️ 维护约定：守卫脚本被合法修改后（例如升级），必须同步这里与
#    <user-home>/<guards-kit-dir>/guard/BASELINE.md，否则 guardctl 会持续报 DRIFT。
#    改脚本前先跑 `bash guardctl.sh snapshot` 留档。
# ==============================================================================

