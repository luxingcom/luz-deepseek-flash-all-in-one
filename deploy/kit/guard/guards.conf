# ==============================================================================
# 自恢复链（RECOVERY）—— 2026-09-11 扩展
#
# 管理对象：healthcheck-rebuild.sh 的**冷却窗状态**。它有一个不对称的失效模式：
# state 被写入未来时间戳后，旧判据 `NOW-LAST < COOLDOWN` 恒为真 ⇒ **永不重建**，
# 且没有任何日志表明它坏了。2026-09-11 实测 state=1789104989、NOW−LAST=−49518，
# 自愈链要到 2026-09-11 05:36:29 UTC 才自然解锁。
#
# 格式：RECOVERY|<role>|<名称>|<state 文件>|<链脚本>|<期望冷却秒>|<必需>|<说明>
# 判定优先级：state 非数字/缺失 → 未来时间戳(DEAD) → 冷却窗内(OK) → 已过(OK)
# 另附静态检查：链脚本若**不含**负值护栏，直接报 DEGRADED——那正是根因本身。
# ==============================================================================

RECOVERY|head|healthcheck-rebuild|/opt/aicad-prod/state/healthcheck-rebuild.head|/opt/aicad-prod/scripts/healthcheck-rebuild.sh|1800|yes|P1 重建的冷却窗状态。负值=自愈链被永久锁死（2026-09-11 事故根因）
